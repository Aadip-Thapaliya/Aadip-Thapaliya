<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="280" viewBox="0 0 400 280" role="img" aria-label="CAUSE: 5 policy datasets stress-tested"><title>CAUSE: 5 policy datasets stress-tested</title><style>
.sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif} .mono{font-family:'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace}
@keyframes fade{from{opacity:0}to{opacity:1}}
