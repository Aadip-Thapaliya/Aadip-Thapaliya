<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="96" viewBox="0 0 1200 96" role="img" aria-label="What I&#x27;m building"><title>What I&#x27;m building</title><style>
.sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif} .mono{font-family:'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.fade{animation:fade .8s ease-out both}
.rise{animation:rise .8s ease-out both}
</style><text x="12" y="40" class="mono" font-size="14" fill="#f0803c">~/projects $ ls --active</text>
<text x="12" y="78" class="sans" font-size="30" font-weight="700" fill="#0e1a2f">What I&#x27;m building</text>
<line x1="338" y1="68" x2="1188" y2="68" stroke="#5a6b85" stroke-opacity=".35" stroke-dasharray="1100" stroke-dashoffset="1100" style="animation:draw 1.4s ease-out .2s forwards"/></svg>
