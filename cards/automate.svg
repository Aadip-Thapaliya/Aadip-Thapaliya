<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="280" viewBox="0 0 400 280" role="img" aria-label="AUTOMATE: -40% manual reporting effort"><title>AUTOMATE: -40% manual reporting effort</title><style>
