<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="border" x1="64" y1="42" x2="1136" y2="388" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0891B2"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="panel" x1="88" y1="64" x2="1112" y2="365" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .muted { fill: #475569; font-family: Inter, Segoe UI, Arial, sans-serif; }
      .title { fill: #0F172A; font-family: Inter, Segoe UI, Arial, sans-serif; font-weight: 800; }
      .accent { fill: #0891B2; font-family: Inter, Segoe UI, Arial, sans-serif; font-weight: 700; }
      .code { fill: #7C3AED; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
      .line { stroke-dasharray: 760; stroke-dashoffset: 760; animation: draw 5s ease-in-out infinite alternate; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: center; }
      .float { animation: float 4s ease-in-out infinite; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes pulse { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    </style>
  </defs>

  <rect width="1200" height="430" fill="#F1F5F9"/>
  <rect x="44" y="34" width="1112" height="362" rx="22" stroke="url(#border)" stroke-width="3" opacity="0.95"/>
  <rect x="66" y="56" width="1068" height="318" rx="16" fill="url(#panel)" stroke="#CBD5E1"/>

  <g opacity="0.42">
    <path class="line" d="M96 306 C190 232, 261 263, 334 192 S493 106, 594 170 S757 276, 871 210 S1049 119, 1104 170" stroke="#0891B2" stroke-width="2" fill="none"/>
    <path class="line" d="M99 327 C233 272, 302 309, 421 236 S619 143, 720 214 S890 319, 1096 239" stroke="#7C3AED" stroke-width="2" fill="none" style="animation-delay: .7s"/>
  </g>

  <g class="float" filter="url(#soft)">
    <circle cx="168" cy="130" r="58" fill="#0891B2" opacity="0.11"/>
    <circle cx="220" cy="216" r="82" fill="#7C3AED" opacity="0.10"/>
    <circle cx="286" cy="128" r="26" fill="#059669" opacity="0.15"/>
  </g>

  <g transform="translate(110 96)">
    <text class="code" x="0" y="0" font-size="18">&gt; aadip.profile()</text>
    <text class="title" x="0" y="70" font-size="58">Aadip Thapaliya</text>
    <text class="accent" x="0" y="116" font-size="28">Data Science | Machine Learning | Causal Inference</text>
    <text class="muted" x="0" y="163" font-size="21">Building forecasting systems, causal pipelines, and AI-assisted analytical tools.</text>

    <g transform="translate(0 214)">
      <rect width="178" height="42" rx="21" fill="#FFFFFF" stroke="#0891B2" opacity="0.95"/>
      <text class="accent" x="28" y="28" font-size="16">Python + SQL</text>
      <rect x="198" width="190" height="42" rx="21" fill="#FFFFFF" stroke="#7C3AED" opacity="0.95"/>
      <text class="accent" x="226" y="28" font-size="16" fill="#7C3AED">Time Series</text>
      <rect x="408" width="190" height="42" rx="21" fill="#FFFFFF" stroke="#059669" opacity="0.95"/>
      <text class="accent" x="436" y="28" font-size="16" fill="#059669">ML Pipelines</text>
    </g>
  </g>

  <g transform="translate(854 98)">
    <rect width="214" height="206" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text class="code" x="24" y="42" font-size="15">focus_stack = [</text>
    <text class="muted" x="42" y="76" font-size="16">"causal inference",</text>
    <text class="muted" x="42" y="107" font-size="16">"forecasting",</text>
    <text class="muted" x="42" y="138" font-size="16">"deep learning",</text>
    <text class="muted" x="42" y="169" font-size="16">"AI agents"</text>
    <text class="code" x="24" y="198" font-size="15">]</text>
    <circle class="pulse" cx="188" cy="30" r="6" fill="#059669"/>
  </g>
</svg>
